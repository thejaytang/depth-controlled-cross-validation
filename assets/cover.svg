<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Depth-Controlled Cross-Validation</title>
  <desc id="desc">A source PDF and upstream JSON flow through configurable cross-checks into page and document reports.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#102b43"/>
      <stop offset="1" stop-color="#174866"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="410" rx="22" fill="url(#bg)"/>
  <rect x="56" y="45" width="72" height="7" rx="3" fill="#ff826f"/>
  <text x="56" y="116" fill="#fff" font-family="Georgia,serif" font-size="53" font-weight="700">Depth-Controlled Cross-Validation</text>
  <text x="58" y="155" fill="#cde5ed" font-family="Arial,sans-serif" font-size="24">Find PDF extraction discrepancies and focus human review.</text>
  <g font-family="Arial,sans-serif">
    <rect x="58" y="210" width="292" height="136" rx="17" fill="#f7fbfd"/>
    <rect x="454" y="210" width="292" height="136" rx="17" fill="#f7fbfd"/>
    <rect x="850" y="210" width="292" height="136" rx="17" fill="#f7fbfd"/>
    <text x="82" y="268" fill="#1d6271" font-size="22" font-weight="700">01 · INPUT</text>
    <text x="82" y="307" fill="#12344c" font-size="27" font-weight="700">Source PDF + JSON</text>
    <text x="478" y="268" fill="#1d6271" font-size="22" font-weight="700">02 · VALIDATE</text>
    <text x="478" y="307" fill="#12344c" font-size="27" font-weight="700">Depth 1–5</text>
    <text x="874" y="268" fill="#1d6271" font-size="22" font-weight="700">03 · REVIEW</text>
    <text x="874" y="307" fill="#12344c" font-size="25" font-weight="700">Page + document</text>
  </g>
  <path d="M368 278h65m-15-11 15 11-15 11M764 278h65m-15-11 15 11-15 11" fill="none" stroke="#37b9bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="386" fill="#cde5ed" font-family="Arial,sans-serif" font-size="18">Evidence support · located findings · targeted review items</text>
</svg>
